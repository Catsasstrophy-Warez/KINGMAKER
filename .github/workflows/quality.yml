name: KINGMAKER Quality

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  swift-and-assets:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Swift tests
        run: swift test --scratch-path "$RUNNER_TEMP/kingmaker-swiftpm"
      - name: Build App target
        run: |
          xcodebuild -project DeadHighway.xcodeproj -scheme DeadHighway \
            -destination 'generic/platform=iOS Simulator' build
      - name: App UI tests
        run: |
          xcodebuild -project DeadHighway.xcodeproj -scheme DeadHighway \
            -destination 'platform=iOS Simulator,name=iPhone 16' test
      - name: Production QA
        run: python3 Tools/production_qa.py
      - name: Diff check
        run: git diff --check
