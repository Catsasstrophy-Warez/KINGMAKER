name: KINGMAKER quality

on:
  push:
    branches: [master]
  pull_request:

jobs:
  swift:
    name: Swift package tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Test package
        run: swift test

  assets:
    name: Runtime asset contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate USDZ archive
        run: python3 Tools/validate_assets.py
      - name: Validate Blender generator syntax
        run: find Tools -name "*.py" -print0 | xargs -0 -n1 python3 -m py_compile
